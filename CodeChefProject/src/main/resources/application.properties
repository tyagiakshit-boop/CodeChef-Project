spring.application.name=CodeChefProject
spring.config.import=optional:file:.env[.properties]
# =====================================================================
#  Campus CodeChef Chapter - Event Management
#  No credentials are hardcoded: every value below can be overridden with
#  an environment variable and the defaults only use the local H2 database.
# =====================================================================

# ------------------------------- Server -------------------------------
# Render / Docker inject PORT (or SERVER_PORT); local dev falls back to 8081.
server.port=${PORT:${SERVER_PORT:9090}}
server.error.include-message=always

# ----------------------------- Datasource ----------------------------
# Default: in-memory H2. Point DB_URL / DB_USERNAME / DB_PASSWORD at Postgres
# (the driver is already on the classpath) to run against a real database,
# e.g. DB_URL=jdbc:postgresql://localhost:5432/codechef_club
spring.datasource.url=${DB_URL:jdbc:h2:mem:codechefclub;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# -------------------------------- JPA --------------------------------
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# ----------------------------- H2 console ----------------------------
# Development helper only, reachable at http://localhost:8081/h2-console
# (JDBC URL: jdbc:h2:mem:codechefclub, user: sa, password: empty)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# ------------------------------- JSON --------------------------------
# Spring Boot 4 ships Jackson 3: java.time values are already written as
# ISO-8601 strings, so no extra serialization flags are required here.
# Jackson 3 enables FAIL_ON_NULL_FOR_PRIMITIVES by default, which would reject
# an otherwise valid event payload that simply omits the primitive "featured"
# flag (a 400 instead of the entity default "false"). Turn it back off so an
# absent/null boolean keeps its Java default and only bean validation decides
# whether a payload is acceptable.
spring.jackson.deserialization.fail-on-null-for-primitives=false

# --------------------------- Static assets ---------------------------
spring.web.resources.cache.period=0

# ------------------------------ Logging ------------------------------
logging.level.com.example.CodeChefProject=INFO
